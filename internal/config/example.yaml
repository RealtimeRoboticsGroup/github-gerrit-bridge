# Example bridge configuration. Secrets live in the files named by *_file.

# HTTP listener for GitHub webhooks (POST /webhook) and GET /healthz.
listen: ":8080"
workers: 4
# Full resync this often, in case events or webhooks were missed.
resync_interval: 30m

gerrit:
  url: https://gerrit.example.com
  project: frc971/971-Robot-Code
  # REST API account and its HTTP password (Settings > HTTP Credentials).
  http_user: github-bridge
  http_password_file: /etc/github-gerrit-bridge/gerrit-http-password
  # Local bare mirror (a cache; safe to delete).
  mirror_dir: /var/cache/github-gerrit-bridge/mirror.git
  ssh:
    address: gerrit.example.com:29418
    user: github-bridge
    # Unencrypted private key registered for http_user.
    key_file: /etc/github-gerrit-bridge/id_ed25519
    # e.g. ssh-keyscan -p 29418 gerrit.example.com > known_hosts
    known_hosts_file: /etc/github-gerrit-bridge/known_hosts
    # Optional: a key in Gerrit's etc/peer_keys (base64 blob and one-word
    # comment per line). Lets imports from GitHub be owned by the mapped
    # Gerrit user via suexec. Keep it separate from key_file: it can act as
    # anyone.
    # peer_key_file: /etc/github-gerrit-bridge/peer_key
    keepalive_interval: 15s
    keepalive_count_max: 3
    # Reconnect and resync if no event arrives for this long; 0 disables.
    watchdog: 0s

github:
  owner: frc971
  repo: 971-Robot-Code
  webhook_secret_file: /etc/github-gerrit-bridge/webhook-secret
  # API token: either a file, or a command that prints one.
  token_command: [gh, auth, token]
  # token_file: /etc/github-gerrit-bridge/github-token
  # Only import GitHub PRs opened after this (RFC 3339); earlier ones are
  # left alone. Omit to import all.
  # import_created_after: 2026-10-04T00:00:00Z

identity:
  # GitHub users are matched to the Gerrit account with the same username
  # (how Gerrit's github plugin names accounts). Comments, votes, uploads
  # and /submit then act as that account (Run-As). Users with no account
  # are handled by the bridge account, with their name in the text.
  match_usernames: true
  # Exceptions: GitHub login -> Gerrit username.
  github_to_gerrit:
    octocat: ocat

ci:
  # Uploads by members of this group are built automatically by
  # gerrit-buildkite. The bridge account must not be a member.
  trusted_group: Verified Users
  # Labels voted by CI; mirrored as gerrit/<Label> statuses.
  labels: [Verified]
  # CI messages: group 1 Started|Succeeded|Failed, group 2 the build URL.
  message_pattern: 'Build (Started|Succeeded|Failed): (\S+)'
  # Read CI results from Buildkite rather than from CI's Gerrit messages,
  # and show each job in Gerrit's Checks tab.
  # buildkite:
  #   organization: realtimeroboticsgroup
  #   pipeline: ci
  #   token_file: /etc/gerrit-github-bridge/buildkite-token   # read_builds
  # Where browsers reach this bridge (proxy /checks/ to it). Write the
  # Gerrit plugin with: bridge --config ... --checks_plugin > $site/plugins/bridge-checks.js
  # checks_url: https://realtimeroboticsgroup.org/gerrit-bridge
