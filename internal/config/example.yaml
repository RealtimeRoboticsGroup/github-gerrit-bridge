# Example bridge configuration. Secrets live in the files named by *_file.

# HTTP listener for GitHub webhooks (POST /webhook), /checks and GET
# /healthz. Plain HTTP: put a TLS proxy in front, and expose only /webhook
# and /checks/ through it. The default is 127.0.0.1:8080.
listen: "127.0.0.1:8080"
workers: 4
# A status page for operators, on a loopback address only (off unless
# set), and its "Force resync" button (off unless true).
# status_listen: "127.0.0.1:8081"
# status_resync: false
# Full resync this often, in case events or webhooks were missed.
resync_interval: 30m
# Which side owns the target branches (main, releases): "gerrit" (the
# default: Gerrit submits, replication copies its branches to GitHub) or
# "github" (PRs merge on GitHub, under its branch protection; the bridge
# copies GitHub's branches into Gerrit, which marks the changes merged).
# "github" needs github.user_app, and its own setup (design §3.1).
branch_owner: gerrit

gerrit:
  url: https://gerrit.example.com
  project: frc971/971-Robot-Code
  # REST API account and its HTTP password (Settings > HTTP Credentials).
  http_user: github-bridge
  http_password_file: /etc/github-gerrit-bridge/gerrit-http-password
  # Local bare mirror (a cache; safe to delete).
  mirror_dir: /var/cache/github-gerrit-bridge/mirror.git
  ssh:
    address: gerrit.example.com:29418
    user: github-bridge
    # Unencrypted private key registered for http_user.
    key_file: /etc/github-gerrit-bridge/id_ed25519
    # e.g. ssh-keyscan -p 29418 gerrit.example.com > known_hosts
    known_hosts_file: /etc/github-gerrit-bridge/known_hosts
    # Optional: a key in Gerrit's etc/peer_keys (base64 blob and one-word
    # comment per line). Lets imports from GitHub be owned by the mapped
    # Gerrit user via suexec. Keep it separate from key_file: it can act as
    # anyone.
    # peer_key_file: /etc/github-gerrit-bridge/peer_key
    keepalive_interval: 15s
    keepalive_count_max: 3
    # Reconnect and resync if no event arrives for this long; 0 disables.
    watchdog: 0s

github:
  owner: frc971
  repo: 971-Robot-Code
  # At least 32 characters: openssl rand -hex 32.
  webhook_secret_file: /etc/github-gerrit-bridge/webhook-secret
  # Optional: accept deliveries only from GitHub's "hooks" ranges
  # (https://api.github.com/meta), if the bridge sees GitHub's addresses.
  # webhook_allowed_networks: [192.30.252.0/22, 185.199.108.0/22, 140.82.112.0/20, 143.55.64.0/20]
  # The reverse proxy in front of the bridge, whose X-Forwarded-For names
  # the sender (for the allowlist and per-address limits).
  # webhook_trusted_proxies: [127.0.0.1/32]
  # API token: either a file, or a command that prints one.
  token_command: [gh, auth, token]
  # token_file: /etc/github-gerrit-bridge/github-token
  # Only import GitHub PRs opened after this (RFC 3339); earlier ones are
  # left alone. Omit to import all.
  # import_created_after: 2026-10-04T00:00:00Z
  # Committer of the commits the bridge adds to PRs ("Patchset N from
  # Gerrit"). Default: the bridge's Gerrit account.
  # committer_name: Gerrit
  # committer_email: gerrit@example.com
  # People can link their GitHub account at <public_url>/github/link, so
  # their Gerrit comments, replies and Code-Review votes are posted on
  # GitHub as them. A GitHub App with Pull requests and Issues read &
  # write (and, where GitHub owns the branches, Contents read & write, for
  # /submit), installed on the repository, whose callback URL is
  # <public_url>/github/link/callback (design §7.2). public_url may be
  # under a path (behind Gerrit's proxy, say).
  # user_app:
  #   client_id: Iv23liExample
  #   client_secret_file: /etc/github-bridge/user-app-secret
  #   public_url: https://bridge.example.com
  #   tokens_file: /var/lib/github-bridge/user-tokens
  #   key_file: /etc/github-bridge/user-tokens-key  # openssl rand -hex 32

identity:
  # GitHub users are matched to the Gerrit account with the same username
  # (how Gerrit's github plugin names accounts). Comments, votes, uploads
  # and /submit then act as that account (Run-As). Users with no account
  # are handled by the bridge account, with their name in the text.
  match_usernames: true
  # Exceptions: GitHub login -> Gerrit username.
  github_to_gerrit:
    octocat: ocat
  # Where Gerrit's accounts are LDAP's (auth.type = LDAP), its usernames
  # are not GitHub logins: say whose GitHub account is whose in LDAP
  # instead (design §7). It is then the only mapping: whoever it does not
  # list is nobody, and match_usernames and github_to_gerrit may not be
  # set beside it. Entries of object_class under base_dn give their uid
  # (the Gerrit username) a githubLogin and githubId; only the
  # directory's admins should write them. Read anonymously over LDAPS,
  # verified against ca_file, every refresh_interval; unreadable, it
  # matches nobody.
  # ldap:
  #   url: ldaps://ldap.spacecookies.dev:636
  #   ca_file: /etc/github-bridge/ldap-ca.pem
  #   base_dn: ou=People,dc=spacecookies,dc=dev
  #   object_class: githubAccount   # the default
  #   refresh_interval: 5m          # the default

ci:
  # Uploads by members of this group are built automatically by
  # gerrit-buildkite. The bridge account must not be a member.
  trusted_group: Verified Users
  # Labels voted by CI; mirrored as gerrit/<Label> statuses.
  labels: [Verified]
  # CI's Gerrit account. Without Buildkite, only its messages set the
  # gerrit/Verified link; unset, none do.
  account: buildkite
  # CI messages: group 1 Started|Succeeded|Failed, group 2 the build URL.
  message_pattern: 'Build (Started|Succeeded|Failed): (\S+)'
  # Read CI results from Buildkite rather than from CI's Gerrit messages,
  # and show each job in Gerrit's Checks tab.
  # buildkite:
  #   organization: realtimeroboticsgroup
  #   pipeline: ci
  #   token_file: /etc/gerrit-github-bridge/buildkite-token   # read_builds
  # Where browsers reach this bridge (proxy /checks/ to it). Write the
  # Gerrit plugin with: bridge --config ... --checks_plugin > $site/plugins/bridge-checks.js
  # With branch_owner github, the Checks tab shows GitHub's checks instead,
  # only to those signed in to Gerrit: checks_url must then be a path under
  # gerrit.url (https://host/gerrit/bridge for https://host/gerrit), so
  # browsers send their Gerrit session, whose cookie is for Gerrit's path.
  # checks_url: https://realtimeroboticsgroup.org/gerrit-bridge
